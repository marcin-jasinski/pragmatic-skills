name: check

on:
  push:
  pull_request:

jobs:
  shared-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Shared blocks are identical across skills
        run: python3 scripts/check-shared-blocks.py
